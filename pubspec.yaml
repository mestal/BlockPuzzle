name: block_puzzle
description: "Renkli bloklarla gizli resmi ortaya çıkaran nonogram bulmaca oyunu."
publish_to: 'none'
version: 0.1.8+8

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.5.0
  google_mobile_ads: ^9.2.0
  intl: ^0.20.2
  meta: ^1.17.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  assets:
    - assets/levels/
    - assets/worlds/
    - assets/audio/
  uses-material-design: true
  fonts:
    # Fredoka with the accented Latin letters it lacks (ş, ğ, İ, ș, ...)
    # added as composites of its own glyphs (tool/make_fredoka.py).
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-400.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-700.ttf
          weight: 700
    # Nunito is the rounded fallback for what Fredoka still lacks (Cyrillic,
    # Greek, Vietnamese stacked marks). Static instances
    # (tool/make_fallback_fonts.py): Flutter ignores the wght axis of a
    # variable font and would draw Nunito ExtraLight.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
