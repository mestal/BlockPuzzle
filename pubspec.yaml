name: block_puzzle
description: "Renkli bloklarla gizli resmi ortaya çıkaran nonogram bulmaca oyunu."
publish_to: 'none'
version: 0.1.3+3

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  google_mobile_ads: ^9.2.0
  intl: ^0.20.2
  meta: ^1.17.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  assets:
    - assets/levels/
    - assets/worlds/
    - assets/audio/
  uses-material-design: true
  fonts:
    # Fredoka lacks Latin Extended (ş, ğ, İ, ș, ...); Nunito is its rounded
    # fallback so those letters match instead of using the system font.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
